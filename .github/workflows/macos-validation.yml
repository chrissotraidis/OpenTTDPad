name: macOS validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # macOS minutes are free for public repositories. While the repository is
    # private, run this only on demand (Actions > Run workflow) and use
    # scripts/check-local.sh for every change.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPTION_USE_ASSERTS=ON
      - name: Build
        run: cmake --build build/macos --parallel 4
      - name: Test
        run: ctest --test-dir build/macos --output-on-failure --exclude-regex '^regression_' --timeout 300
