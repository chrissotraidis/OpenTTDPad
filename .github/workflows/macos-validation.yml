name: macOS validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPTION_USE_ASSERTS=ON
      - name: Build
        run: cmake --build build/macos --parallel 4
      - name: Test
        run: ctest --test-dir build/macos --output-on-failure
