name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  unsigned-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache reference sources
        uses: actions/cache@v4
        with:
          path: ref
          key: openttdpad-ref-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-reference.sh', 'patches/**') }}
      - name: Fetch audited inputs
        run: ./scripts/bootstrap-reference.sh
      - name: Build unsigned device app and IPA
        run: |
          ./scripts/build-device.sh
          ./scripts/package-ipa.sh
      - name: Package corresponding source and patch set
        run: ./scripts/package-source-release.sh
      - name: Verify release inventory
        run: ./scripts/verify-release.sh
      - name: Write consolidated release checksums
        run: |
          cp THIRD_PARTY_NOTICES.md build/artifacts/THIRD_PARTY_NOTICES.md
          # PadMint builds from the release recipe it finds in SHA256SUMS.
          cp padmint.json "build/artifacts/OpenTTDPad-$GITHUB_REF_NAME-padmint.json"
          cd build/artifacts
          shasum -a 256 OpenTTDPad-unsigned.ipa \
            OpenTTDPad-corresponding-source.zip \
            OpenTTDPad-downstream.patch THIRD_PARTY_NOTICES.md \
            "OpenTTDPad-$GITHUB_REF_NAME-padmint.json" > SHA256SUMS
      - name: Attach unsigned artifacts to a draft release
        # A tag never publishes on its own: it creates a draft for review, and
        # leaves an existing (reviewed or already published) release untouched.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; its reviewed files are left unchanged."
            exit 0
          fi
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft "$@" \
            build/artifacts/OpenTTDPad-unsigned.ipa \
            build/artifacts/OpenTTDPad-unsigned.ipa.sha256 \
            build/artifacts/OpenTTDPad-corresponding-source.zip \
            build/artifacts/OpenTTDPad-downstream.patch \
            build/artifacts/OpenTTDPad-source.sha256 \
            build/artifacts/THIRD_PARTY_NOTICES.md \
            "build/artifacts/OpenTTDPad-$GITHUB_REF_NAME-padmint.json" \
            build/artifacts/SHA256SUMS
