name: Upstream drift

on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

jobs:
  compare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned and latest stable tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/OpenTTD/OpenTTD.git | awk -F/ '{print $3}' | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -1)
          pinned=$(sed -n 's/^- Release tag: `\([^`]*\)`.*/\1/p' UPSTREAM_VERSION.md)
          if [ -z "$pinned" ]; then
            echo "UPSTREAM_VERSION.md does not record the pinned release tag" >&2
            exit 1
          fi
          printf 'Pinned: %s\nLatest: %s\n' "$pinned" "$latest"
          if [ "$latest" != "$pinned" ]; then
            title="Upstream OpenTTD $latest is available"
            if ! gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --title "$title" --body "OpenTTDPad pins $pinned. Verify upstream facts, run ./scripts/sync-upstream.sh $latest in a clean branch, and execute the complete macOS, Simulator, and device verification matrix."
            fi
          fi
